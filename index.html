    <!-- Painted before any JS runs, so a slow start is never a blank white page.
         Vue replaces #app on mount. Colors match --bg in src/styles.css. -->
    <style>
      html, body { margin: 0; background: #f7fafc; }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; color: #94a3b8; font: 600 28px/1 system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; letter-spacing: .2em; }

        html, body { background: #0e0f12; }
        .boot-splash { color: #475569; }
      }
