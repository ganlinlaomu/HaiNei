name = "hainei-media"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

[vars]
AUTH_CHALLENGE_TTL_SECONDS = "300"
AUTH_CHALLENGE_PER_MINUTE_PER_SOURCE = "120"
AUTH_CHALLENGE_PER_MINUTE_GLOBAL = "2400"
AUTH_REQUESTS_PER_MINUTE_PER_PUBKEY = "480"
MAX_API_BODY_BYTES = "524288"
PUSH_AUTHORIZATION_TTL_SECONDS = "2592000"
PUSH_TRIGGER_PER_MINUTE_PER_SENDER = "60"
PUSH_TRIGGER_PER_MINUTE_PER_RECIPIENT = "30"
PUSH_TRIGGER_PER_MINUTE_PER_DEVICE = "30"
PUSH_TRIGGER_PER_MINUTE_GLOBAL = "1000"
PUSH_FETCH_TIMEOUT_MS = "8000"
# Comma-separated exact provider origins. Keep this list intentionally narrow.
PUSH_ALLOWED_ORIGINS = "https://web.push.apple.com,https://fcm.googleapis.com,https://updates.push.services.mozilla.com"
UPLOAD_TOKEN_TTL_SECONDS = "3600"
MAX_FILE_SIZE_BYTES = "26214400"
DAILY_UPLOAD_COUNT = "500"
DAILY_UPLOAD_BYTES = "5368709120"
VAPID_PUBLIC_KEY = "BKizbdewmQM2sZZPg8KwdokwXozVxOQIRYwPGJR12p_qbKaGuQBJBBZ1D3XykY_UrZJbWJarPnDh2ds5zSfeits" # Replace with the generated public key before production deploy.
VAPID_SUBJECT = "mailto:admin@hainei.app"

[[d1_databases]]
binding = "DB"
database_name = "blossom-imgbed-db"
database_id = "28adbba4-77ec-418e-af4b-6a1e91cbe927"
migrations_dir = "migrations"

[[services]]
binding = "BLOSSOM"
service = "blossom-imgbed"

# Set server-side only with:
# npx wrangler secret put BLOSSOM_SERVICE_TOKEN --config worker/wrangler.toml
# npx wrangler secret put RELAY_APP_TOKEN --config worker/wrangler.toml
# RELAY_APP_URL is a normal Worker variable; RELAY_APP_TOKEN must remain a secret.
# npx wrangler secret put VAPID_PRIVATE_KEY --config worker/wrangler.toml
# VAPID_PRIVATE_KEY must never be added to this file.
