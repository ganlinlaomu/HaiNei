name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VITE_HAINEI_WORKER_URL: https://hainei-media.noster.workers.dev
      VITE_ENABLE_NIP46: "true"
      HAINEI_KEYSTORE_BASE64: ${{ secrets.HAINEI_ANDROID_KEYSTORE_BASE64 }}
      HAINEI_KEYSTORE_PASSWORD: ${{ secrets.HAINEI_ANDROID_KEYSTORE_PASSWORD }}
      HAINEI_KEY_ALIAS: ${{ secrets.HAINEI_ANDROID_KEY_ALIAS }}
      HAINEI_KEY_PASSWORD: ${{ secrets.HAINEI_ANDROID_KEY_PASSWORD }}
      HAINEI_FIREBASE_CONFIG_BASE64: ${{ secrets.HAINEI_FIREBASE_CONFIG_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        run: npm ci

      - name: Verify HaiNei Worker URL
        run: |
          if [ -z "$VITE_HAINEI_WORKER_URL" ]; then
            echo "::error::Repository variable VITE_HAINEI_WORKER_URL is required for Android builds"
            exit 1
          fi
          case "$VITE_HAINEI_WORKER_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_HAINEI_WORKER_URL must use https://"
              exit 1
              ;;
          esac

      - name: Build HaiNei web app
        run: npm run build

      - name: Install Capacitor 8 build tooling
        run: |
          mkdir -p .capacitor-ci
          printf '{"private":true}' > .capacitor-ci/package.json
          npm install --prefix .capacitor-ci --package-lock=false @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          mkdir -p node_modules/@capacitor
          ln -sfn "$PWD/.capacitor-ci/node_modules/@capacitor/core" node_modules/@capacitor/core
          ln -sfn "$PWD/.capacitor-ci/node_modules/@capacitor/cli" node_modules/@capacitor/cli
          ln -sfn "$PWD/.capacitor-ci/node_modules/@capacitor/android" node_modules/@capacitor/android

      - name: Install optional Firebase push plugin
        run: |
          if [ -z "$HAINEI_FIREBASE_CONFIG_BASE64" ]; then
            echo "::warning::Firebase config missing; native Android push will be unavailable in this APK."
            exit 0
          fi
          npm install --prefix .capacitor-ci --package-lock=false @capacitor/push-notifications@8
          ln -sfn "$PWD/.capacitor-ci/node_modules/@capacitor/push-notifications" node_modules/@capacitor/push-notifications
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@capacitor/push-notifications'] = '^8.0.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          NODE

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        run: |
          ./.capacitor-ci/node_modules/.bin/cap add android
          ./.capacitor-ci/node_modules/.bin/cap sync android

      - name: Inject Firebase Android configuration
        run: |
          if [ -z "$HAINEI_FIREBASE_CONFIG_BASE64" ]; then exit 0; fi
          printf '%s' "$HAINEI_FIREBASE_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const matches = data.client?.some(c => c.client_info?.android_client_info?.package_name === 'cafe.aso.hainei');
          if (!matches) throw new Error('Firebase google-services.json must match cafe.aso.hainei');
          NODE

      - name: Prepare Android build metadata
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          echo "HAINEI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "HAINEI_VERSION_NAME=$BASE_VERSION+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare release signing
        run: |
          READY=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
            && [ -n "$HAINEI_KEYSTORE_BASE64" ] \
            && [ -n "$HAINEI_KEYSTORE_PASSWORD" ] \
            && [ -n "$HAINEI_KEY_ALIAS" ] \
            && [ -n "$HAINEI_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/hainei-release.jks"
            printf '%s' "$HAINEI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            echo "HAINEI_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "HAINEI_ENABLE_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
            READY=true
          else
            echo "HAINEI_ENABLE_RELEASE_SIGNING=0" >> "$GITHUB_ENV"
          fi
          echo "HAINEI_SIGNING_READY=$READY" >> "$GITHUB_ENV"

      - name: Patch native updater and version
        run: node scripts/patch-android-update.mjs

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAINEI_SIGNING_READY == 'true'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || env.HAINEI_SIGNING_READY != 'true'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          if [ "$HAINEI_SIGNING_READY" = "true" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/HaiNei.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/HaiNei-debug.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaiNei-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAINEI_SIGNING_READY == 'true'
        run: |
          SHA256="$(sha256sum artifacts/HaiNei.apk | awk '{print $1}')"
          NOTES="$(git log -1 --pretty=%s)"
          node scripts/generate-android-update-manifest.mjs \
            artifacts/update.json \
            "$HAINEI_VERSION_CODE" \
            "$HAINEI_VERSION_NAME" \
            "$SHA256" \
            "$GITHUB_SHA" \
            "$NOTES"

      - name: Publish rolling signed GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAINEI_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="android-latest"
          RELEASE_TITLE="HaiNei Android Latest · $HAINEI_VERSION_NAME"
          NOTES_FILE="$RUNNER_TEMP/android-release-notes.txt"
          printf 'Latest signed HaiNei Android APK.\n\nVersion: %s\nVersion code: %s\nCommit: %s\n' \
            "$HAINEI_VERSION_NAME" "$HAINEI_VERSION_CODE" "$GITHUB_SHA" > "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG" --force
            gh release upload "$RELEASE_TAG" artifacts/HaiNei.apk artifacts/update.json --clobber
            gh release delete-asset "$RELEASE_TAG" HaiNei-debug.apk -y >/dev/null 2>&1 || true
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$RELEASE_TAG" artifacts/HaiNei.apk artifacts/update.json \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

      - name: Warn when release signing is not configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAINEI_SIGNING_READY != 'true'
        run: |
          echo "::warning::Signed Android release was not published. Configure HAINEI_ANDROID_KEYSTORE_BASE64, HAINEI_ANDROID_KEYSTORE_PASSWORD, HAINEI_ANDROID_KEY_ALIAS, and HAINEI_ANDROID_KEY_PASSWORD."
